<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating...</title>
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 2rem 3rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      max-width: 400px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .info { color: #3b82f6; }
    h3 { margin: 0 0 10px; }
    p { color: #64748b; margin: 0; }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 24px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <h3 id="title">Authenticating...</h3>
      <p id="message">Please wait while we verify your magic link.</p>
    </div>
  </div>

  <script type="module">
    // ✅ TAMA: .ts extension
    import { AdminAuthService } from '/src/services/supabase.service.ts';

    async function handleCallback() {
      const titleEl = document.getElementById('title');
      const messageEl = document.getElementById('message');
      const spinner = document.getElementById('spinner');
      
      try {
        const result = await AdminAuthService.handleCallback();
        
        if (result.success) {
          titleEl.innerHTML = '✅ ' + result.message;
          titleEl.className = 'success';
          messageEl.innerHTML = 'Redirecting you to the admin dashboard...';
          spinner.style.display = 'none';
          
          setTimeout(() => {
            window.location.href = '/admin';
          }, 2000);
        } else {
          titleEl.innerHTML = '❌ Authentication Failed';
          titleEl.className = 'error';
          messageEl.innerHTML = result.message;
          spinner.style.display = 'none';
          
          const btn = document.createElement('a');
          btn.href = '/admin-login';
          btn.className = 'btn';
          btn.innerHTML = 'Back to Login';
          document.querySelector('.card').appendChild(btn);
        }
      } catch (error) {
        console.error('Callback error:', error);
        titleEl.innerHTML = '❌ Something Went Wrong';
        titleEl.className = 'error';
        messageEl.innerHTML = 'An unexpected error occurred. Please try again.';
        spinner.style.display = 'none';
        
        const btn = document.createElement('a');
        btn.href = '/admin-login';
        btn.className = 'btn';
        btn.innerHTML = 'Back to Login';
        document.querySelector('.card').appendChild(btn);
      }
    }

    handleCallback();
  </script>
</body>
</html>
